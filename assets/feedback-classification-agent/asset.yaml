apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: feedback-classification-agent
  description: Classifies customer feedback as positive, negative, or neutral with reasoning and confidence level to help support executives triage faster

provides:
  apis:
    - name: feedback-classification-agent
      kind: a2a
      ordId: customer.build:apiResource:feedback-classification-4a831.feedback-classification-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
